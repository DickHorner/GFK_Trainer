<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GFK-Trainer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    /* Dark Theme (default) */
    body, body.theme-dark {
      --bg-primary: #1e1e1e;
      --bg-secondary: #2a2a2a;
      --bg-tertiary: #333;
      --bg-hover: #444;
      --text-primary: #e0e0e0;
      --text-secondary: #aaa;
      --text-tertiary: #888;
      --accent-primary: #64b5f6;
      --accent-secondary: #4caf50;
      --border-color: #444;
    }
    
    /* Light Theme */
    body.theme-light {
      --bg-primary: #ffffff;
      --bg-secondary: #f5f5f5;
      --bg-tertiary: #e0e0e0;
      --bg-hover: #d0d0d0;
      --text-primary: #212121;
      --text-secondary: #666;
      --text-tertiary: #999;
      --accent-primary: #1976d2;
      --accent-secondary: #388e3c;
      --border-color: #ccc;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      padding: 20px;
      transition: background 0.3s ease, color 0.3s ease;
    }
    
    h1 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 2rem;
      color: var(--accent-primary);
    }
    
    p {
      text-align: center;
      font-size: 1.1rem;
      line-height: 1.6;
    }
    
    #root {
      max-width: 800px;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <div id="root">
    <h1>GFK-Trainer</h1>
    <p>Gewaltfreie Kommunikation – Lerne und übe.</p>
    <p style="margin-top: 20px; font-size: 0.9rem; color: #888;">Electron scaffold loaded successfully.</p>
  </div>
  <script type="module" src="dist/renderer/main.js"></script>
</body>
</html>
