<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GFK-Trainer</title>
  <link rel="stylesheet" href="src/renderer/styles.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    /* Dark Theme (default) */
    body, body.theme-dark {
      --bg-primary: #1e1e1e;
      --bg-secondary: #2a2a2a;
      --bg-tertiary: #333;
      --bg-hover: #444;
      --text-primary: #e0e0e0;
      --text-secondary: #aaa;
      --text-tertiary: #888;
      --accent-primary: #64b5f6;
      --accent-secondary: #4caf50;
      --border-color: #444;
    }
    
    /* Light Theme */
    body.theme-light {
      --bg-primary: #ffffff;
      --bg-secondary: #f5f5f5;
      --bg-tertiary: #e0e0e0;
      --bg-hover: #d0d0d0;
      --text-primary: #212121;
      --text-secondary: #666;
      --text-tertiary: #999;
      --accent-primary: #1976d2;
      --accent-secondary: #388e3c;
      --border-color: #ccc;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      padding: 0;
      margin: 0;
      overflow: hidden;
      transition: background 0.3s ease, color 0.3s ease;
      line-height: 1.6;
    }
    
    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }
    
    ::-webkit-scrollbar-track {
      background: var(--bg-secondary);
    }
    
    ::-webkit-scrollbar-thumb {
      background: var(--bg-hover);
      border-radius: 5px;
    }
    
    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-tertiary);
    }
    
    /* Focus visible for accessibility */
    *:focus-visible {
      outline: 2px solid var(--accent-primary);
      outline-offset: 2px;
    }
    
    /* Button base styles */
    button {
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    button:focus-visible {
      outline: 2px solid var(--accent-primary);
      outline-offset: 2px;
    }
    
    /* Responsive typography */
    h1 {
      font-size: clamp(1.5rem, 4vw, 2rem);
      font-weight: 600;
      line-height: 1.2;
    }
    
    h2 {
      font-size: clamp(1.25rem, 3vw, 1.5rem);
      font-weight: 600;
      line-height: 1.3;
    }
    
    h3 {
      font-size: clamp(1.1rem, 2.5vw, 1.25rem);
      font-weight: 500;
      line-height: 1.4;
    }
    
    p {
      font-size: clamp(0.9rem, 2vw, 1rem);
      line-height: 1.6;
    }
    
    /* Mobile optimization */
    @media (max-width: 768px) {
      body {
        font-size: 14px;
      }
    }
    
    #root {
      width: 100%;
      height: 100vh;
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body>
  <div id="root">
    <h1>GFK-Trainer</h1>
    <p>Gewaltfreie Kommunikation – Lerne und übe.</p>
    <p style="margin-top: 20px; font-size: 0.9rem; color: #888;">Electron scaffold loaded successfully.</p>
  </div>
  <script type="module" src="dist/renderer/main.js"></script>
</body>
</html>
